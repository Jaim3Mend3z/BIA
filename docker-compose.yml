services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: bia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: bia
      POSTGRES_USER: bia_user
      POSTGRES_PASSWORD: bia_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bia_user -d bia"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
